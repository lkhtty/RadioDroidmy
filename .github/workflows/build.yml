name: Build RadioDroid APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Free Release APK
        run: ./gradlew assembleFreeRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RadioDroid-M3U-Release
          path: app/build/outputs/apk/free/release/*.apk
